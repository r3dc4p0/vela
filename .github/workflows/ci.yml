name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      # Compile the benchmarks (running them in CI is too slow and noisy), and
      # run a reduced set so a gross regression is still caught.
      - name: Build benchmarks
        run: cargo bench --no-run

      - name: Smoke benchmark
        env:
          VELA_BENCH_SMALL: "1"
        run: cargo bench --bench core_bench -- --warm-up-time 1 --measurement-time 1

      - name: Release build
        run: cargo build --release
