[package]
name = "vela"
version = "0.3.0"
edition = "2021"
rust-version = "1.82"
description = "Vela — a modern, fast terminal text editor with familiar keyboard shortcuts"
license = "MIT"
keywords = ["editor", "tui", "terminal", "text"]
categories = ["command-line-utilities", "text-editors"]
readme = "README.md"

[[bin]]
name = "vela"
path = "src/main.rs"

[lib]
name = "vela"
path = "src/lib.rs"

[dependencies]
# Terminal UI
ratatui = { version = "0.30", default-features = false, features = [
    "crossterm",
    "std",
    "layout-cache",
] }
crossterm = "0.29"

# Text storage
ropey = "1.6"

# Configuration / serialization
serde = { version = "1", features = ["derive"] }
toml = "0.9"

# Diagnostics
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter", "std"] }
tracing-appender = "0.2"

# System integration
arboard = { version = "3", default-features = false }
dirs = "6"
signal-hook = "0.3"

# Text utilities
memchr = "2"
regex = "1"
unicode-width = "0.2"
unicode-segmentation = "1"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.7", default-features = false, features = ["cargo_bench_support"] }
proptest = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.bench]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = true

[[bench]]
name = "core_bench"
harness = false
